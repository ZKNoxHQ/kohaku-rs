name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "feat/kohaku-railgun" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: "crates"

    - run: nix develop .#ci
    - run: nix develop .#ci --command bash -c "cd crates && cargo check --all-targets --all-features"
    - run: nix develop .#ci --command bash -c "cd crates && cargo clippy --all-targets --all-features"
    - run: nix develop .#ci --command bash -c "cd crates && cargo test --all-targets --all-features --release"
    # Service-backed and separately provisioned POI tests remain opt-in.
    - run: >-
        nix develop .#ci --command bash -c
        "cd crates && cargo test --workspace --tests --all-features --release -- --ignored
        --skip sync_utxo::test_sync_utxo --skip sync_txid::test_sync_txid
        --skip transact_poi::test_transact_poi --skip poi::provider::fresh_proof_tests::"

  test-wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: "crates"

    - run: nix develop .#ci
    - run: nix develop .#ci --command bash -c "cd crates && cargo check --target wasm32-unknown-unknown --workspace --exclude kohaku-fork-kit --exclude kohaku-tor-rpc --lib"
    - run: nix develop .#ci --command bash -c "cd crates && cargo clippy --target wasm32-unknown-unknown --workspace --exclude kohaku-fork-kit --exclude kohaku-tor-rpc --lib"
