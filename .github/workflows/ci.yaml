name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: "crates"

    - run: nix develop .#ci
    - run: nix develop .#ci --command bash -c "cd crates && cargo check --all-targets --all-features"
    - run: nix develop .#ci --command bash -c "cd crates && cargo clippy --all-targets --all-features"
    - run: nix develop .#ci --command bash -c "cd crates && cargo test --all-targets --all-features --release"
    # Railgun ignored integration tests need RPC/dev-key secrets; run them in a dedicated workflow.
    - run: nix develop .#ci --command bash -c "cd crates && cargo test --workspace --exclude kohaku-railgun --all-targets --all-features --release -- --ignored"

  test-wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: "crates"

    - run: nix develop .#ci
    - run: nix develop .#ci --command bash -c "cd crates && cargo check --target wasm32-unknown-unknown --workspace --exclude kohaku-fork-kit --lib"
    - run: nix develop .#ci --command bash -c "cd crates && cargo clippy --target wasm32-unknown-unknown --workspace --exclude kohaku-fork-kit --lib"
