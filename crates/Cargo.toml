[workspace]
members = [
    "fork-kit",
    "kv-store",
    "merkle-tree",
    "pir-rpc",
    "privacy-rpc",
    "tor-rpc",
    "tornadocash",
    "tornadocash-circuit",
    "userop-kit",
]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
result_large_err = { level = "allow" }
cast_possible_truncation = { level = "allow" }

[workspace.dependencies]
alloy = "2.4.1"
alloy-sol-types = "1.7"
anyhow = "1.0.104"
ark-bn254 = "0.6.0"
ark-ff = "0.6.0"
async-trait = "0.1.92"
blake-hash = "0.2.0"
brotli = "9.0.0"
cfg_aliases = "0.2.2"
criterion = "0.8.2"
flate2 = "1.1"
futures = "0.3"
hex = "0.4.3"
insta = "1.48.0"
kohaku-fork-kit = { path = "fork-kit" }
kohaku-kv-store = { path = "kv-store" }
kohaku-merkle-tree = { path = "merkle-tree" }
kohaku-pir-rpc = { path = "pir-rpc" }
kohaku-privacy-rpc = { path = "privacy-rpc" }
kohaku-tor-rpc = { path = "tor-rpc" }
kohaku-tornadocash = { path = "tornadocash" }
kohaku-tornadocash-circuit = { path = "tornadocash-circuit" }
kohaku-userop-kit = { path = "userop-kit" }
num-bigint = "0.5.1"
num-traits = "0.2.19"
postcard = "1.1.3"
rand = "0.10.2"
redb = "4.3.0"
reqwest = "0.13.4"
ruint = "1.20.0"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
websnark-rs = "0.8.0"
