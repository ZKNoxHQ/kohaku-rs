[workspace]
members = [
    "crypto",
    "eip-1193",
    "fork-kit",
    "kv-store",
    "merkle-tree",
    "poseidon-rust",
    "railgun",
    "tornadocash",
    "tornadocash-circuit",
    "userop-kit",
]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
result_large_err = { level = "allow" }
cast_possible_truncation = { level = "allow" }

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
alloy = "2.4.1"
alloy-sol-types = "1.7"
anyhow = "1.0.104"
ark-bn254 = "0.6.0"
ark-circom = "0.6.0"
ark-ff = "0.6.0"
ark-groth16 = { version = "0.6.0", default-features = false }
ark-relations = "0.6.0"
ark-serialize = "0.6.0"
ark-std = { version = "0.6.0", features = ["getrandom"] }
async-trait = "0.1.92"
bech32 = "0.11.1"
blake-hash = "0.2.0"
brotli = "9.0.0"
cfg_aliases = "0.2.2"
console_error_panic_hook = "0.1"
criterion = "0.8.2"
ctr = "0.9.2"
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.2.0"
flate2 = "1.1"
futures = "0.3"
gloo-timers = "0.3.0"
hex = "0.4.3"
insta = "1.48.0"
itertools = "0.14.0"
js-sys = "0.3"
kohaku-crypto = { path = "crypto" }
kohaku-eip-1193 = { path = "eip-1193" }
kohaku-fork-kit = { path = "fork-kit" }
kohaku-kv-store = { path = "kv-store" }
kohaku-merkle-tree = { path = "merkle-tree" }
kohaku-railgun = { path = "railgun" }
kohaku-tornadocash = { path = "tornadocash" }
kohaku-tornadocash-circuit = { path = "tornadocash-circuit" }
kohaku-userop-kit = { path = "userop-kit" }
num-bigint = "0.5.1"
num-traits = "0.2.19"
postcard = "1.1.3"
poseidon-rust = { path = "poseidon-rust" }
rand = "0.10.2"
rand_chacha = "0.10"
rayon = "1.12"
redb = "4.3.0"
reqwest = "0.13.4"
ruint = "1.20.0"
serde = "1.0.229"
serde-wasm-bindgen = "0.6"
serde_json = "1.0.151"
serial_test = "3.3.1"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-test = "0.2.5"
tracing-wasm = "0.2"
tsify = "0.5"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
wasmer = { version = "6.1", default-features = false }
web-time = "1.1"
websnark-rs = "0.8.0"

[patch.crates-io]
# Opt-in parallel feature; without it wasm can hang indefinitely.
ark-circom = { git = "https://github.com/Robert-MacWha/circom-compat", branch = "release/0.6.0" }
